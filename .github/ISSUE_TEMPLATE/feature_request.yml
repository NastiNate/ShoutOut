name: Suggestion
description: An idea to make Shout Out better
labels: [suggestion]
body:
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like Shout Out to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it would help
      description: When would you use it? An example ad helps a lot.
